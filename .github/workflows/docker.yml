name: Docker Build Validation

on:
  pull_request:
    paths:
      - "forge/api/**"
      - "beacon/**"
      - "forge/web/**"
      - "packages/**"
      - "lang/**"
      - "infra/**"
      - ".github/workflows/docker.yml"
  workflow_call:

permissions:
  contents: read

jobs:
  validate-docker:
    name: Build Docker Images (no-push)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Build forge-api image
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          file: forge/api/Dockerfile
          push: false
          tags: ghcr.io/gamepanel/forge-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build beacon image
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: beacon
          file: beacon/Dockerfile
          push: false
          tags: ghcr.io/gamepanel/beacon:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build forge-web image
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          file: forge/web/Dockerfile
          push: false
          tags: ghcr.io/gamepanel/forge-web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
