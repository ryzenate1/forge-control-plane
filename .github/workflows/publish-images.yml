name: Publish Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0 or v0.1.0). Defaults to VERSION file."
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/gamepanel/forge-api
  WEB_IMAGE: ghcr.io/gamepanel/forge-web
  BEACON_IMAGE: ghcr.io/gamepanel/beacon

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        # The `version` input is free text from whoever triggered the run — keep
        # it out of the script body and read it from the environment instead.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            raw="${INPUT_VERSION}"
          elif [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            raw="${GITHUB_REF_NAME}"
          elif [ -f VERSION ]; then
            raw="$(cat VERSION)"
          else
            echo "ERROR: no version input, tag, or VERSION file" >&2
            exit 1
          fi
          # Canonical stored version is without leading `v` (e.g. 0.1.0)
          stripped="${raw#v}"
          tag="v${stripped}"
          # Validate semver (allow prerelease)
          if ! echo "$stripped" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._-]+)?$'; then
            echo "ERROR: version '$stripped' is not semver (X.Y.Z[-prerelease])" >&2
            exit 1
          fi
          echo "raw=$raw" | tee -a "$GITHUB_OUTPUT"
          echo "stripped=$stripped" | tee -a "$GITHUB_OUTPUT"
          echo "tag=$tag" | tee -a "$GITHUB_OUTPUT"
          # `latest` is published ONLY for git-tag builds (refs/tags/v*).
          # workflow_dispatch/VERSION-file builds publish immutable X.Y.Z/vX.Y.Z
          # tags only — the *_latest_line outputs are empty strings there, and
          # build-push-action filters blank lines out of the tags list.
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            echo "api_latest_line=${API_IMAGE}:latest" >> "$GITHUB_OUTPUT"
            echo "beacon_latest_line=${BEACON_IMAGE}:latest" >> "$GITHUB_OUTPUT"
            echo "web_latest_line=${WEB_IMAGE}:latest" >> "$GITHUB_OUTPUT"
            echo "is_tag_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tag_build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved version: raw=$raw stripped=$stripped tag=$tag latest=$([[ "${GITHUB_REF:-}" == refs/tags/v* ]] && echo yes || echo no)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute metadata
        id: meta
        run: |
          echo "git_commit=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push forge-api
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          file: forge/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.version.outputs.stripped }}
            ${{ env.API_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ steps.version.outputs.api_latest_line }}
          build-args: |
            VERSION=${{ steps.version.outputs.stripped }}
            GIT_COMMIT=${{ steps.meta.outputs.git_commit }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.stripped }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.git_commit }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_time }}

      - name: Build and push beacon
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: beacon
          file: beacon/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.BEACON_IMAGE }}:${{ steps.version.outputs.stripped }}
            ${{ env.BEACON_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ steps.version.outputs.beacon_latest_line }}
          build-args: |
            VERSION=${{ steps.version.outputs.stripped }}
            GIT_COMMIT=${{ steps.meta.outputs.git_commit }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.stripped }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.git_commit }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_time }}

      - name: Build and push forge-web
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          file: forge/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.version.outputs.stripped }}
            ${{ env.WEB_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ steps.version.outputs.web_latest_line }}
          build-args: |
            VERSION=${{ steps.version.outputs.stripped }}
            GIT_COMMIT=${{ steps.meta.outputs.git_commit }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            NEXT_PUBLIC_APP_VERSION=${{ steps.version.outputs.stripped }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.stripped }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.git_commit }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_time }}

      - name: Verify images exist in registry
        run: |
          set -euo pipefail
          for img in "${API_IMAGE}:${{ steps.version.outputs.stripped }}" "${BEACON_IMAGE}:${{ steps.version.outputs.stripped }}" "${WEB_IMAGE}:${{ steps.version.outputs.stripped }}"; do
            echo "Verifying $img is pullable..."
            docker pull "$img" >/dev/null && echo "  OK $img" || (echo "  FAIL $img not found" >&2; exit 1)
          done
          echo "All release images are referenceable via TAG=${{ steps.version.outputs.stripped }} (and ${{ steps.version.outputs.tag }})."

      - name: Summary
        run: |
          latest_note="no (manual dispatch builds publish immutable version tags only)"
          if [ "${{ steps.version.outputs.is_tag_build }}" = "true" ]; then
            latest_note="yes (tag builds also move :latest)"
          fi
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Published images
          | Component | Image |
          |-----------|-------|
          | forge-api | \`${API_IMAGE}:${{ steps.version.outputs.stripped }}\` and \`${API_IMAGE}:${{ steps.version.outputs.tag }}\` |
          | beacon    | \`${BEACON_IMAGE}:${{ steps.version.outputs.stripped }}\` and \`${BEACON_IMAGE}:${{ steps.version.outputs.tag }}\` |
          | forge-web | \`${WEB_IMAGE}:${{ steps.version.outputs.stripped }}\` and \`${WEB_IMAGE}:${{ steps.version.outputs.tag }}\` |

          \`latest\` published: ${latest_note}.
          Set \`TAG=${{ steps.version.outputs.stripped }}\` (or \`${{ steps.version.outputs.tag }}\`) in \`infra/.env\`.
          Kubernetes manifests in \`infra/ship/kubernetes\` must substitute \`\${TAG}\` before \`kubectl apply\`.
          EOF
