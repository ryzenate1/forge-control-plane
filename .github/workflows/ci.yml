name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

timeout-minutes: 30

jobs:
  forge-api:
    name: forge/api (Go)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: forge/api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: forge/api/go.mod
          cache-dependency-path: forge/api/go.sum

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1.6
          working-directory: forge/api
          args: --timeout=5m

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -timeout 10m -count=1 ./...

  migrations:
    name: migrations (static validation)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Duplicate identifiers, filename shape, tenancy columns, FK and index
      # coverage. Until now this script was never invoked by CI at all, while
      # docs/migration-rollback-policy.md documented it as a wired guard.
      - name: Validate migrations
        run: bash scripts/test/validate_migrations.sh

      - name: Verify migration count docs
        run: |
          count=$(ls forge/api/migrations/*.sql | wc -l | tr -d ' ')
          echo "migration files: $count"
          echo "migration_count=$count" >> "$GITHUB_OUTPUT"
          # Fail closed if the documented count drifted; update
          # docs/migration-rollback-policy.md and AGENTS.md to match.
          if ! grep -q "$count migrations" docs/migration-rollback-policy.md; then
            echo "::error::docs/migration-rollback-policy.md count does not mention $count migrations"
            exit 1
          fi

  forge-api-integration:
    name: forge/api (Go, PostgreSQL)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: forge/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Turns every "PostgreSQL unavailable" skip in the store tests into a
      # failure. Without it the migration suite skips itself and the job reports
      # green, which is how the 243 production migrations came to be never
      # applied against PostgreSQL in CI.
      FORGE_TEST_REQUIRE_POSTGRES: "1"
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: forge/api/go.mod
          cache-dependency-path: forge/api/go.sum

      # Scoped to the store package: this job exists to apply real migrations
      # to a real PostgreSQL, including via the production runner
      # (Store.RunMigrations). The rest of the suite runs in the forge-api job.
      - name: Migration tests against PostgreSQL
        run: go test -race -timeout 15m -count=1 ./internal/store/

  beacon:
    name: beacon (Go)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: beacon
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: beacon/go.mod
          cache-dependency-path: beacon/go.sum

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1.6
          working-directory: beacon
          args: --timeout=5m

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -timeout 10m -count=1 ./...

  packages:
    name: packages (shared-types, sdk, ui, game-templates)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build:packages

      - name: Test packages
        run: |
          test -f packages/sdk/package.json
          test -f packages/game-templates/package.json
          npm --workspace @forge/sdk test
          npm --workspace @forge/game-templates test

  web:
    name: forge/web (Next.js)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm --workspace @forge/web run typecheck

      - name: Lint
        run: npm --workspace @forge/web run lint

      - name: Test
        run: npm --workspace @forge/web test

      - name: Build
        run: npm --workspace @forge/web run build
