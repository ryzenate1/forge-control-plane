version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gosec
    - gocritic
    - gocyclo
    - goconst
    - funlen
    - whitespace
  settings:
    misspell:
      locale: US
    gosec:
      excludes:
        - G304
  # Run from the repo root as `golangci-lint run ./...` or per-module as
  # `(cd forge/api && golangci-lint run ./...)`. Paths below are relative to
  # the directory golangci-lint runs from, so anchor both the legacy
  # `reference/` study checkouts and the in-tree `forge/api/reference/`.
  exclusions:
    rules:
      - path: (^|/)reference/
        linters: [errcheck, govet, staticcheck, unused]
      - path: (^|/)reference-repos/
        linters: [errcheck, govet, staticcheck, unused]

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
