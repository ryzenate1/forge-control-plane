# Optional Docker secrets override for sensitive environment variables.
# Usage:
#   docker compose -f compose.yml -f compose.secrets.yml --env-file .env up -d
#
# IMPORTANT: the forge API, beacon daemon, and web frontend read secrets
# exclusively through plain environment variables (e.g. os.Getenv(
# "API_AUTH_SECRET")) and do NOT support *_FILE variants, so their values
# MUST come from .env. Only the official postgres image reads
# POSTGRES_PASSWORD_FILE natively; that is the one secret actually delivered
# through Docker secrets here.
#
# gen-env.sh generates the files below into infra/secrets/ with values that
# match .env, so the mounts resolve and stay consistent with the environment
# variables the services consume. Do NOT blank the plain env vars here — the
# applications would then start with empty credentials.
secrets:
  postgres_password:
    file: ./secrets/postgres_password.secret
  forge_master_key:
    file: ./secrets/forge_master_key.secret
  daemon_node_token:
    file: ./secrets/daemon_node_token.secret
  api_auth_secret:
    file: ./secrets/api_auth_secret.secret
  app_key:
    file: ./secrets/app_key.secret

services:
  # The official postgres entrypoint gives POSTGRES_PASSWORD_FILE precedence
  # over POSTGRES_PASSWORD, so the secret file is authoritative. The .env
  # fallback stays intact, so the stack still works if the file is missing.
  postgres:
    secrets:
      - postgres_password
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

  # Secrets for the API, daemon, and web are mounted as files for reference,
  # but the services read their credentials from the plain environment
  # variables supplied by .env (see header note above).
  api:
    secrets:
      - forge_master_key
      - daemon_node_token
      - api_auth_secret
      - app_key

  daemon:
    secrets:
      - daemon_node_token

  web:
    secrets:
      - api_auth_secret
