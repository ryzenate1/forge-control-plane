global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    # Forge API exposes Prometheus text metrics at /api/v1/metrics,
    # protected by the shared METRICS_TOKEN bearer credential.
    metrics_path: /api/v1/metrics
    authorization:
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api:8080"]
  - job_name: daemon
    # Beacon daemon exposes Prometheus text metrics at /metrics on its HTTP
    # API port (DAEMON_ADDR, default :9090), protected by the same bearer
    # credential. Per-container workload metrics are included per server_id.
    metrics_path: /metrics
    authorization:
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["daemon:9090"]
  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]
  - job_name: pushgateway
    static_configs:
      - targets: ["pushgateway:9091"]
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
  # Caddy admin API (127.0.0.1:2019) is loopback-only inside the caddy
  # container by design (unauthenticated config API — see compose.yml
  # CADDY_ADMIN). It is NOT reachable at caddy:2019 over the backend
  # network, so no scrape job is defined here. To monitor Caddy, expose
  # metrics through the prometheus `caddy` module sidecar or bind the admin
  # API to the backend network with authentication, then re-add:
  # - job_name: caddy
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["caddy:2019"]
