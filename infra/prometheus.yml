global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["api:8080"]
  - job_name: daemon
    metrics_path: /metrics
    static_configs:
      - targets: ["daemon:9090"]
  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
  - job_name: caddy
    static_configs:
      - targets: ["caddy:2019"]
  - job_name: web
    static_configs:
      - targets: ["web:3000"]
